version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kspdb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kspdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kspdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kspdb-backend
    ports:
      - "3000:3000"
    environment:
      # Connection string to reach the Postgres container
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/kspdb?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    # Mount local backend folder to enable hot-reloading inside the container
    volumes:
      - ./backend:/app
      # Keep the container's node_modules isolated from the host
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kspdb-frontend
    ports:
      - "5173:5173"
    environment:
      # Inject the backend URL for the frontend to consume
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    # Mount local frontend folder to enable hot-reloading inside the container
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules isolated from the host
      - /app/node_modules

volumes:
  postgres_data: